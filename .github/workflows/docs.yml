name: Documentación

# Construye y comprueba el sitio de documentación (website/) en cada cambio que
# lo afecte, y lo publica en GitHub Pages desde main.
#
# El sitio lee del repositorio las versiones de los crates (Cargo.toml), los
# ejemplos (example/ y crates/*/examples/) y el catálogo de códigos de
# cpeforge-xcodes, así que esos cambios también lo reconstruyen.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "example/**"
      - "crates/*/Cargo.toml"
      - "crates/*/examples/**"
      - "crates/xcodes/src/**"
      - "Cargo.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "example/**"
      - "crates/*/Cargo.toml"
      - "crates/*/examples/**"
      - "crates/xcodes/src/**"
      - "Cargo.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # El sitio vive en https://alvarez25leo.github.io/cpeforge/.
  DOCS_BASE_PATH: /cpeforge
  DOCS_SITE_URL: https://alvarez25leo.github.io

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm build
      # Enlaces internos y anclas (#id) de todas las páginas exportadas.
      - run: pnpm check:links
      # Al publicar desde Actions, Pages sirve el artefacto tal cual (sin
      # Jekyll), así que las carpetas `_next` no necesitan `.nojekyll`.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: website/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # Un despliegue en curso no se cancela a mitad.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
