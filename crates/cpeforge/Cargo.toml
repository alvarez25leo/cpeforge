[package]
name = "cpeforge"
version = "0.1.0"
description = "CPEForge: SDK en Rust para facturación electrónica en Perú (envío SOAP y GRE a SUNAT)."
readme = "README.md"
keywords = ["sunat", "peru", "cpe", "ubl", "facturacion"]
categories = ["api-bindings"]
exclude = ["tests/"]
edition.workspace = true
rust-version = "1.88"
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
xcodes = ["dep:cpeforge-xcodes"]

[dependencies]
cpeforge-core.workspace = true
cpeforge-xml = { path = "../xml", version = "0.1.0" }
cpeforge-xmldsig = { path = "../xmldsig", version = "0.1.0" }
cpeforge-gre-api = { path = "../gre-api", version = "0.1.0" }
cpeforge-ws = { path = "../ws", version = "0.1.0" }
cpeforge-xcodes = { path = "../xcodes", version = "0.2.0", optional = true }
jiff.workspace = true

[dev-dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
base64.workspace = true
sha2.workspace = true
cpeforge-core = { workspace = true, features = ["serde"] }

[lints]
workspace = true

[[example]]
name = "see_with_xcodes"
required-features = ["xcodes"]
