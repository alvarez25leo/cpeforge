[package]
name = "cpeforge-ubl-validator"
version = "0.1.1"
description = "Validador XSD 1.0 de documentos UBL 2.0 y 2.1 con recursos locales verificados."
readme = "README.md"
keywords = ["ubl", "xsd", "xml", "sunat", "cpe"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
exclude = ["tests/"]

[dependencies]
cpeforge-xml-limits.workspace = true
roxmltree.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[build-dependencies]
cc.workspace = true
pkg-config.workspace = true

[dev-dependencies]
cpeforge-xml = { path = "../xml", version = "0.1.0" }
cpeforge-core = { workspace = true, features = ["serde"] }
jiff.workspace = true
serde_path_to_error.workspace = true

[[example]]
name = "validate_ubl"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
