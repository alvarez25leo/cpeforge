# Configuración de cargo-deny revisada para el workspace (ver docs/estandares-rust.md).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
# Licencias permisivas aceptadas para dependencias. Los crates del workspace
# se publican con licencia MIT (`LICENSE`, atribuciones en `NOTICE`).
allow = ["MIT", "Apache-2.0", "Unlicense", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Única excepción: openssl-macros 0.1.1 (macro de compilación de openssl, que
# usa cpeforge-xmldsig) depende de syn 2, mientras serde_derive ya usa
# syn 3. No llega al binario final. Revisar al actualizar openssl.
skip = [{ crate = "syn@2.0.117", reason = "openssl-macros 0.1.1 aún depende de syn 2 (solo en compilación)" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
